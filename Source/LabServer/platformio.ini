; LabLink Server — PlatformIO Configuration
; ESP32 DevKit V1 with Arduino Core 3.x

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; ── CRITICAL: Pin these exact sources to avoid ESPAsyncTCP / RPAsyncTCP ──
; The old "me-no-dev" ESPAsyncWebServer pulls in ESP8266 TCP libs by mistake.
; Use mathieucarbou's maintained fork — it is compatible with Arduino core 3.x
lib_deps =
    mathieucarbou/AsyncTCP         @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.3.12
    adafruit/RTClib                 @ ^2.1.4
    adafruit/Adafruit GFX Library   @ ^1.12.6
    adafruit/Adafruit SSD1306       @ ^2.5.16

; Partition table — needs more than default app space for this project
board_build.partitions = no_ota.csv

; Suppress the harmless TCP_MSS warning that still appears from some deps
build_flags =
    -DASYNC_TCP_SSL_ENABLED=0

    